name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.4"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Web Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Install export templates
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import project assets
        run: godot --headless --import 2>&1 | tail -20 || true

      - name: Export to Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Add COOP/COEP service worker for GitHub Pages
        # GitHub Pages doesn't support custom headers; this service worker
        # injects Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy
        # headers required by Godot 4's WebAssembly threading.
        run: |
          curl -sL \
            "https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js" \
            -o build/web/coi-serviceworker.js
          sed -i 's|</head>|<script src="coi-serviceworker.js"></script></head>|' build/web/index.html

      - name: Cache-bust asset URLs
        # Appends ?v=<short-sha> to every Godot asset URL so browsers always
        # fetch the latest files after each deploy instead of serving stale cache.
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          sed -i \
            -e "s|\.wasm\"|.wasm?v=${SHORT_SHA}\"|g" \
            -e "s|\.pck\"|.pck?v=${SHORT_SHA}\"|g" \
            -e "s|index\.js\"|index.js?v=${SHORT_SHA}\"|g" \
            -e "s|\.worker\.js\"|.worker.js?v=${SHORT_SHA}\"|g" \
            -e "s|\.audio\.worklet\.js\"|.audio.worklet.js?v=${SHORT_SHA}\"|g" \
            build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
